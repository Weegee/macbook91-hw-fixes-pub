PACKAGE_NAME="macbook91-applesmc"
PACKAGE_VERSION="@PKGVER@"

# Replaces in-tree applesmc (updates/ wins over kernel/ in depmod's search).
BUILT_MODULE_NAME[0]="applesmc"
BUILT_MODULE_LOCATION[0]="build/"
DEST_MODULE_LOCATION[0]="/updates"

MAKE[0]="make KDIR=/lib/modules/${kernelver}/build PKGVER=${PACKAGE_VERSION}"

# Only series with a patched source; other kernels keep in-tree applesmc.
BUILD_EXCLUSIVE_KERNEL="^(6\.18|7\.2)\."
AUTOINSTALL="yes"
